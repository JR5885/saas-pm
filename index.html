<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語言切換示範</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .lang-btn {
            padding: 8px 16px;
            cursor: pointer;
            margin: 0 5px;
            font-size: 16px;
        }
        .content {
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <!-- 語言切換按鈕 -->
    <div>
        <button class="lang-btn" onclick="switchLanguage('zh')">中文</button>
        <button class="lang-btn" onclick="switchLanguage('en')">English</button>
    </div>

    <!-- 內容區域 -->
    <div class="content">
        <h1 id="title">歡迎來到我們的網站</h1>
        <p id="description">這是一個支援中文繁體與英文互相切換的範例網頁。</p>
        <button id="action-btn">點擊這裡</button>
    </div>

    <script>
        // 定義各語言的文字字典
        const translations = {
            zh: {
                title: "歡迎來到我們的網站",
                description: "這是一個支援中文繁體與英文互相切換的範例網頁。",
                actionBtn: "點擊這裡"
            },
            en: {
                title: "Welcome to Our Website",
                description: "This is a sample webpage that supports switching between Traditional Chinese and English.",
                actionBtn: "Click Here"
            }
        };

        // 切換語言的函數
        function switchLanguage(lang) {
            // 設定網頁的 lang 屬性
            document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';

            // 替換對應文字
            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('description').innerText = translations[lang].description;
            document.getElementById('action-btn').innerText = translations[lang].actionBtn;
        }
    </script>

</body>
</html>
