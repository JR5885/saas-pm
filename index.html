    function renderKanbanBoard() {
      const kanbanSel = document.getElementById('kanban-filter-module');
      const filterModule = kanbanSel ? kanbanSel.value : 'ALL';
      const cols = { backlog: [], dev: [], test: [], publish: [] };
      const filtered = tickets.filter(t => filterModule === 'ALL' || t.id === filterModule);
      filtered.forEach(t => cols[t.status].push(t));

      ['backlog', 'dev', 'test', 'publish'].forEach(status => {
        const container = document.getElementById(`col-${status}`);
        if (!container) return;
        const count = document.getElementById(`count-${status}`);
        container.innerHTML = '';
        if (count) count.innerText = cols[status].length;

        cols[status].forEach(t => {
          const card = document.createElement('div');
          card.className = `p-2.5 bg-[#0a121e] border ${t.risk ? 'border-rose-500/80 shadow-lg' : 'border-cyber-border'} rounded-lg text-xs space-y-2`;
          
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="font-mono text-[10px] text-cyber-cyan font-bold">${t.id} ${t.risk ? '⚠️' : ''}</span>
              <span class="px-1.5 py-0.5 rounded bg-slate-900 text-white font-bold text-[9px]">${t.primary}</span>
            </div>
            <p class="text-slate-200 font-sans text-[11px] cursor-pointer" onclick="openEditTicketModal('${t.id}')">${t.title}</p>
            <div class="flex justify-between items-center pt-1 border-t border-cyber-border/40 font-mono text-[10px]">
              <span class="text-cyber-green font-bold">${t.progress}%</span>
              <div class="space-x-1">
                ${status !== 'backlog' ? `<button onclick="moveTicketCard('${t.id}', 'prev')" class="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 font-bold cursor-pointer" title="Move Left">◀</button>` : ''}
                ${status !== 'publish' ? `<button onclick="moveTicketCard('${t.id}', 'next')" class="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-cyber-cyan font-bold cursor-pointer" title="Move Right">▶</button>` : ''}
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function moveTicketCard(id, direction) {
      const flow = ['backlog', 'dev', 'test', 'publish'];
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;

      let idx = flow.indexOf(ticket.status);
      if (direction === 'next' && idx < flow.length - 1) {
        ticket.status = flow[idx + 1];
        ticket.progress = Math.min(100, ticket.progress + 30);
      } else if (direction === 'prev' && idx > 0) {
        ticket.status = flow[idx - 1];
        ticket.progress = Math.max(10, ticket.progress - 30);
      }

      if (ticket.status === 'dev') {
        teamSubtaskSprints[`${ticket.id}_${ticket.primary}`] = 'Sprint 2 (W3-W4)';
      } else if (ticket.status === 'test') {
        teamSubtaskSprints[`${ticket.id}_${ticket.primary}`] = 'Sprint 3 (W5-W6)';
      } else if (ticket.status === 'publish') {
        teamSubtaskSprints[`${ticket.id}_${ticket.primary}`] = 'Sprint 4 (W7-W8)';
        ticket.progress = 100;
      } else if (ticket.status === 'backlog') {
        teamSubtaskSprints[`${ticket.id}_${ticket.primary}`] = 'Sprint 1 (W1-W2)';
      }

      teamSubtaskProgress[`${ticket.id}_${ticket.primary}`] = ticket.progress;

      renderKanbanBoard();
      renderGanttSchedule();
    }

      if (val === '') return;
      const fData = getFeatureData(val);
      const ticketId = document.getElementById('modal-ticket-id');
      const ticketTitle = document.getElementById('modal-ticket-title');
      if (fData && ticketId && ticketTitle) {
        ticketId.value = val;
        ticketTitle.value = `${val}: ${fData.title}`;
      }
    }

    function saveTicketFromModal() {
      const idEl = document.getElementById('modal-ticket-id');
      const titleEl = document.getElementById('modal-ticket-title');
      const primaryEl = document.getElementById('modal-ticket-primary');
      const sprintEl = document.getElementById('modal-ticket-sprint');
      const statusEl = document.getElementById('modal-ticket-status');
      const progressEl = document.getElementById('modal-ticket-progress');
      const riskEl = document.getElementById('modal-ticket-risk');

      const id = idEl ? idEl.value.trim() : 'Feature 01';
      const title = titleEl ? titleEl.value.trim() : 'New Subtask Ticket';
      const primary = primaryEl ? primaryEl.value : 'Product PM';
      const sprint = sprintEl ? sprintEl.value : 'Sprint 1 (W1-W2)';
      const status = statusEl ? statusEl.value : 'backlog';
      const progress = progressEl ? parseInt(progressEl.value) : 50;
      const risk = riskEl ? riskEl.checked : false;

      const existing = tickets.find(t => t.id === id && t.primary === primary);
      if (existing) {
        existing.title = title;
        existing.sprint = sprint;
        existing.status = status;
        existing.progress = progress;
        existing.risk = risk;
      } else {
        tickets.push({ id, title, primary, sprint, status, progress, risk });
      }

      teamSubtaskSprints[`${id}_${primary}`] = sprint;
      teamSubtaskProgress[`${id}_${primary}`] = progress;

      closeTicketModal();
      renderKanbanBoard();
      renderGanttSchedule();
    }

    function deleteCurrentTicket() {
      closeTicketModal();
      renderKanbanBoard();
    }

    function openGmailKickoffCompose() {
      const selectEl = document.getElementById('req-title-select');
      const code = selectEl ? selectEl.value : 'Feature 01';
      const f = getFeatureData(code);
      const senderEmail = 'mshappyj@gmail.com';
      const subject = `[KICKOFF & SCOPE FREEZE] Project Execution Plan for ${code}`;
      
      const emailBody = `Hi Cross-Functional Team,

As Product PM convening this kickoff for [${code}], all teams must strictly adhere to our Scope Freeze and RACI matrix.

Sender / PM Convener: ${senderEmail}

【Project Kickoff & Scope Details】
- Feature: ${f.title}
- Voice of Customer: ${f.voice}
- Root Cause & Solution: ${f.problem}
- Scope Boundary: ${f.scope}

Please review the Command Center and confirm your team's readiness by EOD today.

Best regards,
Product PM: ${senderEmail}
Omcean Booking Delivery Command Center`;

      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`;
      window.open(gmailUrl, '_blank');
    }

    function renderInstantPrdAndInsights(f) {
      const prdTitleEl = document.getElementById('prd-header-title');
      if (prdTitleEl) prdTitleEl.innerText = `[PRD] ${f.title}`;

      const prdViewEl = document.getElementById('prd-content-view');
      if (prdViewEl) {
        prdViewEl.innerHTML = `
          <div class="border-b border-cyber-border/50 pb-2 mb-2">
            <span class="text-cyber-cyan font-bold block mb-1">1. 架構與解決方案 (Architecture & Solution)</span>
            <p class="text-slate-300">${f.sol}</p>
          </div>
          <div class="border-b border-cyber-border/50 pb-2 mb-2">
            <span class="text-cyber-cyan font-bold block mb-1">2. 核心使用者故事 (User Stories)</span>
            <div>${f.userStories}</div>
          </div>
          <div class="border-b border-cyber-border/50 pb-2 mb-2">
            <span class="text-cyber-cyan font-bold block mb-1">3. Gherkin 驗收條件 (Acceptance Criteria - BDD)</span>
            <div class="space-y-1.5 font-mono text-[11px] bg-[#080d17] p-2.5 rounded border border-cyber-border/40 whitespace-pre-line">${f.gherkinAC}</div>
          </div>
          <div class="border-b border-cyber-border/50 pb-2 mb-2">
            <span class="text-cyber-cyan font-bold block mb-1">4. UI/UX Wireframe (介面草圖)</span>
            <pre class="bg-[#05080f] p-2 rounded text-[10px] text-cyber-gold font-mono overflow-x-auto">${f.wireframe}</pre>
          </div>
          <div class="border-b border-cyber-border/50 pb-2 mb-2">
            <span class="text-cyber-cyan font-bold block mb-1">5. Data Flow / Sequence Diagram (資料流與時序圖)</span>
            <pre class="bg-[#05080f] p-2 rounded text-[10px] text-cyber-green font-mono overflow-x-auto">${f.seqDiag}</pre>
          </div>
          <div class="border-b border-cyber-border/50 pb-2 mb-2">
            <span class="text-cyber-cyan font-bold block mb-1">6. Metrics / Success KPI (成效指標)</span>
            <div class="text-slate-200">${f.kpi}</div>
          </div>
          <div>
            <span class="text-cyber-cyan font-bold block mb-1">8. 邊界異常檢核表 (Edge Cases)</span>
            <div class="text-slate-300 whitespace-pre-line">${f.edgeChecklists.join('\n')}</div>
          </div>
        `;
      }

      const insightsEl = document.getElementById('prd-pm-insights');
      if (insightsEl) {
        insightsEl.innerHTML = `
          <div class="p-2.5 bg-[#05080f] rounded border border-cyber-border space-y-1">
            <div class="text-cyber-cyan font-bold">7. PM 戰情室決策 (Strategic Decisions)</div>
            <div class="text-slate-300 text-[11px] leading-relaxed whitespace-pre-line">${f.pmInsights}</div>
          </div>
        `;
      }
    }

    // 3. 網頁載入時的強健初始化掛載（置於底部確保完美執行）
    window.onload = function() {
      try {
        initDropdowns();
        const hasLoaded = loadSavedData();
        if (!hasLoaded) {
          const selectEl = document.getElementById('req-title-select');
          const step3Sel = document.getElementById('step3-filter-module');
          if (selectEl) {
            selectEl.value = "Feature 01";
            onTitleDropdownChanged("Feature 01");
          }
          if (step3Sel) {
            step3Sel.value = "Feature 01";
          }
        }
        renderKanbanBoard();
        renderGanttSchedule();
      } catch (err) {
        console.error("Initialization Error:", err);
      }
    };
  </script>
</body>
